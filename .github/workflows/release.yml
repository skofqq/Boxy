name: Release APK

# Tag vX.Y.Z: builds the signed APK and attaches it to that release (creates a draft if there is none).
# Manual run: builds the signed APK as a workflow artifact only.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Public fingerprint of the release certificate. An APK signed with anything else cannot update installed Boxy.
  RELEASE_CERT_SHA256: c998d4e4733f1e8e6e268df0d64a6bbb1b298093a210d80f721201b5435a6508

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              exit 1
            fi
          done
          umask 077
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/boxy-release.jks
          {
            echo 'storeFile=keystore/boxy-release.jks'
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: bash ./gradlew :app:assembleRelease --console=plain --no-configuration-cache

      - name: Remove signing key
        if: always()
        run: rm -rf keystore keystore.properties

      - name: Check signature and name the APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk > certs.txt
          actual=$(sed -n 's/.*certificate SHA-256 digest: //p' certs.txt | head -1)
          if [ "$actual" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::APK is signed with $actual, expected the release certificate"
            exit 1
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Boxy-$VERSION.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Boxy-${{ steps.version.outputs.version }}
          path: |
            dist/*.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "Boxy $VERSION" --notes ""
          fi
          gh release upload "$GITHUB_REF_NAME" "dist/Boxy-$VERSION.apk" --clobber
